<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手账基础能力验证 v2</title><style>body{font:15px system-ui;background:#f4efe8;color:#403830;padding:20px}button{padding:9px;margin:3px;border:1px solid #cdbdad;border-radius:9px;background:#fffaf5}#stage{height:500px;background:#cbb39c;border-radius:16px;display:grid;place-items:center;touch-action:none;overflow:hidden}.page{width:260px;height:360px;background:#fffdf8;position:relative;box-shadow:0 10px 25px #0002;transform-origin:center}.item{position:absolute;width:90px;height:60px;background:#ed9f85;border-radius:10px;display:grid;place-items:center;touch-action:none;user-select:none}.text{background:#fff0b0;border:1px dashed #a88438}.hidden{display:none}#status{margin-top:12px;padding:10px;background:#fffaf5;border-radius:9px}</style><h1>跨端基础能力验证 v2</h1><p>拖动元素；双击黄色文字框输入；电脑端用缩放按钮，手机端用双指缩放。</p><button id="add">添加元素</button><button id="addText">添加文字框</button><button id="save">保存 IndexedDB</button><button id="load">读取 IndexedDB</button><button id="clear">清空画布</button><button id="zoomOut">缩小</button><button id="zoomIn">放大</button><button id="reset">重置视图</button><div id="stage"><div id="page"></div></div><div id="editor" class="hidden"><input id="input"><button id="ok">完成文字</button></div><div id="status">等待测试</div><script>const page=document.querySelector('#page'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),editor=document.querySelector('#editor'),input=document.querySelector('#input'),ok=document.querySelector('#ok');let scale=1,panX=0,panY=0,active=null,start=null,pinch=null;const dbReady=new Promise((resolve,reject)=>{const req=indexedDB.open('journal-tech-test-v2',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('pages');req.onsuccess=e=>resolve(e.target.result);req.onerror=reject});const say=x=>status.textContent=x;const transform=()=>page.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;function add(kind,x=80,y=100,text=kind==='text'?'双击输入':'拖动我'){const e=document.createElement('div');e.className='item '+(kind==='text'?'text':'');e.dataset.kind=kind;e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';e.onpointerdown=ev=>{ev.stopPropagation();e.setPointerCapture(ev.pointerId);active=e;start={x:ev.clientX,y:ev.clientY,left:e.offsetLeft,top:e.offsetTop}};e.onpointermove=ev=>{if(active===e){e.style.left=start.left+ev.clientX-start.x+'px';e.style.top=start.top+ev.clientY-start.y+'px'}};e.onpointerup=()=>{active=null};e.ondblclick=()=>{if(kind==='text'){editor.classList.remove('hidden');input.value=e.textContent;input.focus();ok.onclick=()=>{e.textContent=input.value||'文字';editor.classList.add('hidden')}}};page.append(e)}function snapshot(){return{scale,panX,panY,items:[...page.children].map(e=>({kind:e.dataset.kind,text:e.textContent,left:parseInt(e.style.left),top:parseInt(e.style.top)}))}}async function save(){let d=await dbReady,t=d.transaction('pages','readwrite');t.objectStore('pages').put(snapshot(),'current');t.oncomplete=()=>say('保存成功：IndexedDB 已写入当前页面')}async function load(){let d=await dbReady,r=d.transaction('pages').objectStore('pages').get('current');r.onsuccess=()=>{if(!r.result)return say('读取完成：没有保存的数据');page.innerHTML='';let v=r.result;scale=v.scale;panX=v.panX;panY=v.panY;transform();v.items.forEach(i=>add(i.kind,i.left,i.top,i.text));say('读取成功：已恢复 '+v.items.length+' 个元素')}}document.querySelector('#add').onclick=()=>add('shape');document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#clear').onclick=()=>{page.innerHTML='';say('已清空画布，本地数据仍保留')};document.querySelector('#zoomIn').onclick=()=>{scale=Math.min(2,scale+.1);transform();say('画布放大到 '+Math.round(scale*100)+'%')};document.querySelector('#zoomOut').onclick=()=>{scale=Math.max(.5,scale-.1);transform();say('画布缩小到 '+Math.round(scale*100)+'%')};document.querySelector('#reset').onclick=()=>{scale=1;panX=0;panY=0;transform();say('视图已重置')};stage.onpointerdown=e=>{if(e.pointerType==='touch'&&e.isPrimary)pinch={x:e.clientX,y:e.clientY,scale}};stage.onpointermove=e=>{if(pinch&&e.pointerType==='touch'&&e.isPrimary){scale=Math.max(.5,Math.min(2,pinch.scale+(e.clientY-pinch.y)/300));transform()}};stage.onpointerup=()=>pinch=null;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>say('Service Worker 已注册'))</script>
