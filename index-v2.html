<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>手账基础能力验证 v4</title><style>*{box-sizing:border-box}html,body{margin:0;font:15px system-ui;background:#f4efe8;color:#403830;touch-action:manipulation}body{padding:20px}button{padding:9px;margin:3px;border:1px solid #cdbdad;border-radius:9px;background:#fffaf5}#stage{height:500px;background:#cbb39c;border-radius:16px;display:grid;place-items:center;touch-action:none;overflow:hidden}.page{width:260px;height:360px;background:#fffdf8;position:relative;box-shadow:0 10px 25px #0002}.item{position:absolute;width:90px;height:60px;background:#ed9f85;border-radius:10px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}.item.selected{outline:3px solid #6f8fa3;outline-offset:3px}.text{background:#fff0b0;border:1px dashed #a88438}.hidden{display:none}#status{margin-top:12px;padding:10px;background:#fffaf5;border-radius:9px}#editor{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;background:white;border-radius:14px;box-shadow:0 4px 20px #0003;z-index:5}#input{width:70%;font:16px system-ui;padding:9px}</style></head><body>
<h1>跨端基础能力验证 v4</h1><p>单指拖动元素；连续点按文字框两次调用手机输入法。已移除缩放。</p><button id="add">添加元素</button><button id="addText">添加文字框</button><button id="save">保存 IndexedDB</button><button id="load">读取 IndexedDB</button><button id="clear">清空画布</button>
<div id="stage"><div id="page"></div></div><div id="editor" class="hidden"><input id="input" autocomplete="off"><button id="ok">完成文字</button></div><div id="status">等待测试</div>
<script>
const page=document.querySelector('#page'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),editor=document.querySelector('#editor'),input=document.querySelector('#input'),ok=document.querySelector('#ok');let active=null,editing=null;const dbReady=new Promise((resolve,reject)=>{const r=indexedDB.open('journal-tech-test-v4',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('pages');r.onsuccess=e=>resolve(e.target.result);r.onerror=reject});const say=x=>status.textContent=x;
function openTextEditor(e){editing=e;editor.classList.remove('hidden');input.value=e.textContent;input.focus();input.select();say('已调用真实输入框，请输入文字')}
function add(kind,x=80,y=100,text=kind==='text'?'双击输入':'拖动我'){const e=document.createElement('div');e.className='item '+(kind==='text'?'text':'');e.dataset.kind=kind;e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';e.onpointerdown=ev=>{ev.stopPropagation();e.setPointerCapture(ev.pointerId);active={e,id:ev.pointerId,startX:ev.clientX,startY:ev.clientY,left:e.offsetLeft,top:e.offsetTop}};e.onpointermove=ev=>{if(active&&active.e===e&&active.id===ev.pointerId){ev.preventDefault();e.style.left=active.left+ev.clientX-active.startX+'px';e.style.top=active.top+ev.clientY-active.startY+'px'}};e.onpointerup=()=>active=null;e.onpointercancel=()=>active=null;e.onclick=()=>{document.querySelectorAll('.item').forEach(i=>i.classList.remove('selected'));e.classList.add('selected');say('已选中元素，双击文字框可编辑')};e.ondblclick=()=>{if(kind==='text')openTextEditor(e)};page.append(e)}
function snapshot(){return{items:[...page.children].map(e=>({kind:e.dataset.kind,text:e.textContent,left:e.offsetLeft,top:e.offsetTop}))}}async function save(){const d=await dbReady,t=d.transaction('pages','readwrite');t.objectStore('pages').put(snapshot(),'current');t.oncomplete=()=>say('保存成功：IndexedDB 已写入当前页面')}async function load(){const d=await dbReady,r=d.transaction('pages').objectStore('pages').get('current');r.onsuccess=()=>{if(!r.result)return say('读取完成：没有保存的数据');page.innerHTML='';r.result.items.forEach(i=>add(i.kind,i.left,i.top,i.text));say('读取成功：已恢复 '+r.result.items.length+' 个元素')}}document.querySelector('#add').onclick=()=>add('shape');document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#clear').onclick=()=>{page.innerHTML='';say('已清空画布，本地数据仍保留')};ok.onclick=()=>{if(editing){editing.textContent=input.value||'文字';editing=null}editor.classList.add('hidden');say('文字已更新')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>say('Service Worker 已注册')).catch(()=>say('Service Worker 注册失败'));
</script><script>
/* iPhone touch fallback: do not rely on Safari's dblclick event. */
const originalAdd=add;let touchTapTarget=null,touchTapAt=0,touchTapTimer=null;
add=function(kind,x=80,y=100,text=kind==='text'?'双击输入':'拖动我'){
  originalAdd(kind,x,y,text);const old=page.lastElementChild,e=old.cloneNode(true);page.replaceChild(e,old);let drag=null;
  e.onpointerdown=ev=>{ev.stopPropagation();e.setPointerCapture(ev.pointerId);drag={id:ev.pointerId,x:ev.clientX,y:ev.clientY,left:e.offsetLeft,top:e.offsetTop,moved:false}};
  e.onpointermove=ev=>{if(drag&&drag.id===ev.pointerId){if(Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>6)drag.moved=true;e.style.left=drag.left+ev.clientX-drag.x+'px';e.style.top=drag.top+ev.clientY-drag.y+'px'}};
  e.onpointerup=ev=>{const d=drag;drag=null;if(ev.pointerType!=='touch'||!d||d.moved)return;const now=Date.now();if(touchTapTarget===e&&now-touchTapAt<500){clearTimeout(touchTapTimer);touchTapTarget=null;touchTapAt=0;if(kind==='text')openTextEditor(e)}else{touchTapTarget=e;touchTapAt=now;clearTimeout(touchTapTimer);touchTapTimer=setTimeout(()=>{select(e);touchTapTarget=null},320)}};
  e.onpointercancel=()=>drag=null;e.onclick=ev=>{if(ev.pointerType!=='touch')select(e)};e.ondblclick=()=>{if(kind==='text')openTextEditor(e)};
};
stage.addEventListener('click',()=>document.querySelectorAll('.item').forEach(i=>i.classList.remove('selected')));
</script></body></html>
