<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>手账基础能力验证 v3</title>
<style>*{box-sizing:border-box}html,body{margin:0;font:15px system-ui;background:#f4efe8;color:#403830;touch-action:manipulation}body{padding:20px}button{padding:9px;margin:3px;border:1px solid #cdbdad;border-radius:9px;background:#fffaf5}#stage{height:500px;background:#cbb39c;border-radius:16px;display:grid;place-items:center;touch-action:none;overflow:hidden;overscroll-behavior:none}.page{width:260px;height:360px;background:#fffdf8;position:relative;box-shadow:0 10px 25px #0002;transform-origin:center;touch-action:none}.item{position:absolute;width:90px;height:60px;background:#ed9f85;border-radius:10px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}.text{background:#fff0b0;border:1px dashed #a88438}.hidden{display:none}#status{margin-top:12px;padding:10px;background:#fffaf5;border-radius:9px}#editor{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;background:white;border-radius:14px;box-shadow:0 4px 20px #0003;z-index:5}#input{width:70%;font:16px system-ui;padding:9px}</style></head><body>
<h1>跨端基础能力验证 v3</h1><p>单指拖动元素；双击文字框调用手机输入法；双指捏合缩放画布。</p><button id="add">添加元素</button><button id="addText">添加文字框</button><button id="save">保存 IndexedDB</button><button id="load">读取 IndexedDB</button><button id="clear">清空画布</button><button id="zoomOut">缩小</button><button id="zoomIn">放大</button><button id="reset">重置视图</button>
<div id="stage"><div id="page"></div></div><div id="editor" class="hidden"><input id="input" autocomplete="off"><button id="ok">完成文字</button></div><div id="status">等待测试</div>
<script>
const page=document.querySelector('#page'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),editor=document.querySelector('#editor'),input=document.querySelector('#input'),ok=document.querySelector('#ok');let scale=1,panX=0,panY=0,active=null,pointers=new Map(),pinchStart=null,editing=null;const dbReady=new Promise((resolve,reject)=>{const r=indexedDB.open('journal-tech-test-v3',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('pages');r.onsuccess=e=>resolve(e.target.result);r.onerror=reject});const say=x=>status.textContent=x;const transform=()=>page.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
function add(kind,x=80,y=100,text=kind==='text'?'双击输入':'拖动我'){const e=document.createElement('div');e.className='item '+(kind==='text'?'text':'');e.dataset.kind=kind;e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';e.onpointerdown=ev=>{ev.stopPropagation();e.setPointerCapture(ev.pointerId);active={e,id:ev.pointerId,startX:ev.clientX,startY:ev.clientY,left:e.offsetLeft,top:e.offsetTop}};e.onpointermove=ev=>{if(active&&active.e===e&&active.id===ev.pointerId){ev.preventDefault();e.style.left=active.left+ev.clientX-active.startX+'px';e.style.top=active.top+ev.clientY-active.startY+'px'}};e.onpointerup=()=>active=null;e.ondblclick=()=>{if(kind==='text'){editing=e;editor.classList.remove('hidden');input.value=e.textContent;input.focus();input.select()}};page.append(e)}
function snapshot(){return{scale,panX,panY,items:[...page.children].map(e=>({kind:e.dataset.kind,text:e.textContent,left:e.offsetLeft,top:e.offsetTop}))}}async function save(){const d=await dbReady,t=d.transaction('pages','readwrite');t.objectStore('pages').put(snapshot(),'current');t.oncomplete=()=>say('保存成功：IndexedDB 已写入当前页面')}async function load(){const d=await dbReady,r=d.transaction('pages').objectStore('pages').get('current');r.onsuccess=()=>{if(!r.result)return say('读取完成：没有保存的数据');page.innerHTML='';const v=r.result;scale=v.scale;panX=v.panX;panY=v.panY;transform();v.items.forEach(i=>add(i.kind,i.left,i.top,i.text));say('读取成功：已恢复 '+v.items.length+' 个元素')}}document.querySelector('#add').onclick=()=>add('shape');document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#clear').onclick=()=>{page.innerHTML='';say('已清空画布，本地数据仍保留')};function setScale(v){scale=Math.max(.5,Math.min(2,v));transform();say('画布缩放至 '+Math.round(scale*100)+'%')}document.querySelector('#zoomIn').onclick=()=>setScale(scale+.1);document.querySelector('#zoomOut').onclick=()=>setScale(scale-.1);document.querySelector('#reset').onclick=()=>{scale=1;panX=0;panY=0;transform();say('视图已重置')};
stage.onpointerdown=e=>{if(e.pointerType!=='touch')return;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()];pinchStart={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale}}};stage.onpointermove=e=>{if(e.pointerType!=='touch'||!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinchStart){const a=[...pointers.values()];const distance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);setScale(pinchStart.scale*distance/pinchStart.distance)}};function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=null}stage.onpointerup=endPointer;stage.onpointercancel=endPointer;ok.onclick=()=>{if(editing){editing.textContent=input.value||'文字';editing=null}editor.classList.add('hidden')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>say('Service Worker 已注册')).catch(()=>say('Service Worker 注册失败'));
</script></body></html>
