<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材生命周期最小验证</title><style>body{font:15px system-ui;background:#f4efe8;color:#403830;padding:18px;max-width:900px;margin:auto}button{padding:8px 12px;margin:3px;border:1px solid #cdbdad;border-radius:8px;background:#fffaf5}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#fffaf5;border-radius:12px;padding:12px;margin:12px 0}.asset,.use{display:flex;align-items:center;gap:8px;padding:7px;margin:5px 0;background:#fff;border-radius:8px}.asset b,.use b{flex:1}.muted{color:#80756b;font-size:13px}#log{white-space:pre-wrap;background:#292521;color:#f9ead8;border-radius:10px;padding:10px;min-height:80px}@media(max-width:650px){.cols{grid-template-columns:1fr}}</style></head><body>
<h1>素材生命周期最小验证</h1><p class="muted">只验证素材本体、页面使用记录、铁盒记录和 IndexedDB 关系；不是正式素材库。</p>
<div class="box"><button id="reset">重置测试数据</button><button id="save">保存当前页面</button><button id="reload">模拟刷新并读取</button><button id="check">运行一致性检查</button></div>
<div class="cols"><section class="box"><h2>素材本体库</h2><div id="assets"></div><button id="newAsset">新建测试素材</button></section><section class="box"><h2>当前页面画布</h2><div id="uses"></div></section></div>
<div class="box"><h2>当前页铁盒</h2><div id="box"></div></div><div class="box"><h2>测试日志</h2><div id="log">等待操作</div></div>
<script>
const DB='journal-lifecycle-test-v1';let state={assets:[],pages:{pageA:{uses:[],box:[]},pageB:{uses:[],box:[]}},current:'pageA'};const $=s=>document.querySelector(s);const log=x=>$('#log').textContent=x;const db=new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore('state');r.onsuccess=e=>ok(e.target.result);r.onerror=no});
async function persist(){const d=await db,t=d.transaction('state','readwrite');t.objectStore('state').put(state,'current');return new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=no})}async function read(){const d=await db,r=d.transaction('state').objectStore('state').get('current');return new Promise(ok=>{r.onsuccess=()=>ok(r.result)})}
function asset(id){return state.assets.find(a=>a.id===id)}function render(){const p=state.pages[state.current];$('#assets').innerHTML=state.assets.map(a=>`<div class="asset"><b>${a.name}</b><button data-add="${a.id}">加入当前页</button><button data-del="${a.id}">删除素材本体</button></div>`).join('')||'<span class="muted">暂无素材</span>';$('#uses').innerHTML=p.uses.map((id,i)=>`<div class="use"><b>${asset(id)?.name||'缺失素材'}</b><button data-use-del="${i}">删除画布元素</button><button data-box="${id}">放入铁盒</button></div>`).join('')||'<span class="muted">当前页暂无元素</span>';$('#box').innerHTML=p.box.map(id=>`<div class="use"><b>${asset(id)?.name||'缺失素材'}</b><button data-box-add="${id}">重新添加到画布</button><button data-box-del="${id}">从铁盒丢弃</button></div>`).join('')||'<span class="muted">铁盒为空</span>'}
document.addEventListener('click',async e=>{const t=e.target;if(t.id==='newAsset'){const id='asset-'+Date.now();state.assets.push({id,name:'测试素材 '+(state.assets.length+1)});render();return}if(t.id==='reset'){state={assets:[{id:'a1',name:'测试贴纸 A'},{id:'a2',name:'测试贴纸 B'}],pages:{pageA:{uses:[],box:[]},pageB:{uses:[],box:[]}},current:'pageA'};await persist();render();log('已重置：两个素材、两个页面');return}if(t.id==='save'){await persist();log('保存成功：当前页面和铁盒已写入 IndexedDB');return}if(t.id==='reload'){const v=await read();if(v){state=v;render();log('模拟刷新成功：已从 IndexedDB 恢复 '+state.assets.length+' 个素材、当前页 '+state.pages[state.current].uses.length+' 个元素')}else log('没有保存数据');return}if(t.id==='check'){const p=state.pages[state.current];const errors=[];for(const id of p.uses)if(!asset(id))errors.push('画布存在缺失素材 '+id);for(const id of p.box)if(!asset(id))errors.push('铁盒存在缺失素材 '+id);if(errors.length)log('检查失败：\n'+errors.join('\n'));else log('检查通过：页面元素和铁盒引用的素材均存在；删除页面元素不会删除素材本体。');return}if(t.dataset.add){state.pages[state.current].uses.push(t.dataset.add);render();return}if(t.dataset.del){const id=t.dataset.del;const used=Object.values(state.pages).some(p=>p.uses.includes(id)||p.box.includes(id));if(used){log('已阻止删除：素材仍被页面或铁盒使用');return}state.assets=state.assets.filter(a=>a.id!==id);render();return}if(t.dataset.useDel){state.pages[state.current].uses.splice(+t.dataset.useDel,1);render();return}if(t.dataset.box){const p=state.pages[state.current];if(!p.box.includes(t.dataset.box))p.box.push(t.dataset.box);render();return}if(t.dataset.boxAdd){state.pages[state.current].uses.push(t.dataset.boxAdd);render();return}if(t.dataset.boxDel){const p=state.pages[state.current];p.box=p.box.filter(id=>id!==t.dataset.boxDel);render();return}});$('#reset').click();
</script></body></html>
